name: Code Regression

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}
  # #290: 릴리스 워크플로가 같은 테스트 작업을 다시 쓴다.
  workflow_call: {}

permissions:
  contents: read

jobs:
  fast:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
  # #191: test:component 는 --runInBand 로 30분을 넘으므로 단위 테스트와 다른 작업에서 돈다.
  component:
    name: Component tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Component tests
        run: npm run test:component
  typecheck:
    name: Type check source and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check (src + test)
        run: npm run typecheck
  browser-e2e:
    name: Admin, tunnel and browser end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install admin dependencies
        run: npm ci --prefix admin --no-audit --no-fund
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Admin tests
        run: npm run test:admin
      - name: Tunnel end-to-end tests
        run: npm run test:e2e
      - name: Browser end-to-end tests
        run: npm run test:e2e:browser
