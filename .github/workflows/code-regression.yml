name: Code Regression

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fast:
    name: Build, lint, unit and component tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Component tests
        run: npm run test:component
  browser-e2e:
    name: Admin, tunnel and browser end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install admin dependencies
        run: npm ci --prefix admin --no-audit --no-fund
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Admin tests
        run: npm run test:admin
      - name: Tunnel end-to-end tests
        run: npm run test:e2e
      - name: Browser end-to-end tests
        run: npm run test:e2e:browser
