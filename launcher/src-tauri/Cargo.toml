[package]
name = "tttgate-launcher"
# 런처 버전은 tauri.conf.json 이 package.json 에서 읽는다. 이 값은 쓰지 않는다.
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "ISC"
publish = false

[lib]
name = "tttgate_launcher_lib"
path = "src/lib.rs"

[[bin]]
name = "TTTGate-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
# WebView2 가 없을 때 안내 창을 띄운다(NFR-2). tauri 가 이미 쓰는 버전이다.
windows-sys = { version = "=0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[features]
# cargo build 로 만들 때도 화면 파일을 exe 안에 넣는다(tauri CLI 없이 빌드한다).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
